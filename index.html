<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<title>Study Planner</title>

<meta
  http-equiv="Content-Security-Policy"
  content="
    default-src 'self';
    frame-src https://script.google.com https://*.googleusercontent.com;
    script-src 'self' 'unsafe-inline';
    style-src 'self' 'unsafe-inline';
    object-src 'none';
    base-uri 'none';
  "
>

<style>

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #f4f3ee;
}


#gwFrame {
  border: 0;
  width: 100%;
  height: 100vh;
  display: block;
}

</style>

</head>

<body>


<iframe
  id="gwFrame"
  src="https://script.google.com/macros/s/AKfycbw1kEVxIYoiMuHXpyESKCXvSgRWd97wdau_E6jd1yAFBVRRYtiuY22zDc85-2KnndqjWA/exec"
  referrerpolicy="origin"
></iframe>


<script>

(function () {

  "use strict";


  const BASE_URL =
    "https://script.google.com/macros/s/AKfycbw1kEVxIYoiMuHXpyESKCXvSgRWd97wdau_E6jd1yAFBVRRYtiuY22zDc85-2KnndqjWA/exec";


  const iframe =
    document.getElementById(
      "gwFrame"
    );


  /* =======================================================
     TRUSTED APPS SCRIPT ORIGINS
  ======================================================= */

  function isTrustedAppOrigin(origin) {

    try {

      const u =
        new URL(origin);


      return (

        u.protocol === "https:" &&

        (
          u.hostname ===
            "script.google.com" ||

          u.hostname.endsWith(
            ".googleusercontent.com"
          )
        )

      );

    } catch (err) {

      return false;

    }

  }


  /* =======================================================
     VALIDATE NAVIGATION URL
  ======================================================= */

  function isAllowedAppUrl(url) {

    try {

      const u =
        new URL(
          url,
          BASE_URL
        );


      /*
       * Only allow Google Apps Script URLs.
       */

      if (
        u.protocol !== "https:"
      ) {
        return false;
      }


      return (

        u.hostname ===
          "script.google.com" ||

        u.hostname.endsWith(
          ".googleusercontent.com"
        )

      );

    } catch (err) {

      return false;

    }

  }


  /* =======================================================
     RECEIVE APP MESSAGES
  ======================================================= */

  window.addEventListener(
    "message",
    function (ev) {

      /*
       * Only accept messages from
       * Google Apps Script.
       */

      if (
        !isTrustedAppOrigin(
          ev.origin
        )
      ) {

        return;

      }


      const d =
        ev.data;


      if (
        !d ||
        d.source !==
          "study-planner-nav"
      ) {

        return;

      }


      /* ===================================================
         FRAME GUARD HANDSHAKE
      =================================================== */

      if (
        d.type ===
          "frame-guard-hello" &&
        d.nonce
      ) {

        try {

          ev.source.postMessage(
            {
              source:
                "study-planner-nav",

              type:
                "frame-guard-ack",

              nonce:
                d.nonce
            },
            ev.origin
          );

        } catch (err) {}

        return;

      }


      /* ===================================================
         NAVIGATION
      =================================================== */

      if (
        d.type ===
          "navigate" &&
        d.url
      ) {

        if (
          typeof d.url !==
          "string"
        ) {

          return;

        }


        if (
          !isAllowedAppUrl(
            d.url
          )
        ) {

          console.warn(
            "Blocked navigation:",
            d.url
          );

          return;

        }


        const destination =
          new URL(
            d.url,
            BASE_URL
          ).href;


        console.log(
          "Study Planner navigation:",
          destination
        );


        iframe.src =
          destination;

      }

    }
  );


})();
</script>

</body>
</html>
