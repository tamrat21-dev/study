<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Study Planner</title>

<meta http-equiv="Content-Security-Policy"
content="
  default-src 'self';
  frame-src https://script.google.com https://*.googleusercontent.com;
  script-src 'self' 'unsafe-inline';
  style-src 'self' 'unsafe-inline';
  object-src 'none';
  base-uri 'none';
">

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: #f4f3ee;
  overflow: hidden;
}

#gwFrame {
  border: 0;
  width: 100%;
  height: 100vh;
  display: block;
}
</style>
</head>

<body>

<iframe
  id="gwFrame"
  src="https://script.google.com/macros/s/AKfycbyxhyG4eWvvGNVOwSSav0xJwrqt3e4S6ugd1sfO5v55OpJRs5uVcARwK9t--QIea6IR8w/exec"
  referrerpolicy="origin">
</iframe>

<script>
const BASE_URL =
  "https://script.google.com/macros/s/AKfycbyxhyG4eWvvGNVOwSSav0xJwrqt3e4S6ugd1sfO5v55OpJRs5uVcARwK9t--QIea6IR8w/exec";

const iframe = document.getElementById("gwFrame");


function isTrustedGoogleOrigin(origin) {
  try {
    const url = new URL(origin);

    return (
      url.protocol === "https:" &&
      (
        url.hostname === "script.google.com" ||
        url.hostname.endsWith(".googleusercontent.com")
      )
    );

  } catch (error) {
    return false;
  }
}


function isAllowedAppUrl(url) {
  try {
    const u = new URL(url, BASE_URL);

    return (
      u.protocol === "https:" &&
      (
        u.hostname === "script.google.com" ||
        u.hostname.endsWith(".googleusercontent.com")
      )
    );

  } catch (error) {
    return false;
  }
}


window.addEventListener("message", function (ev) {

  // Only accept messages from the Google Apps Script application
  if (!isTrustedGoogleOrigin(ev.origin)) {
    return;
  }

  const d = ev.data;

  if (!d || d.source !== "study-planner-nav") {
    return;
  }


  // Frame guard handshake
  if (d.type === "frame-guard-hello" && d.nonce) {

    ev.source.postMessage(
      {
        source: "study-planner-nav",
        type: "frame-guard-ack",
        nonce: d.nonce
      },
      ev.origin
    );

    return;
  }


  // Navigation
  if (d.type === "navigate" && d.url) {

    if (typeof d.url !== "string") {
      return;
    }

    if (!isAllowedAppUrl(d.url)) {
      console.warn("Blocked navigation:", d.url);
      return;
    }

    console.log("Navigating iframe to:", d.url);

    iframe.src = new URL(d.url, BASE_URL).href;
  }

});
</script>

</body>
</html>
